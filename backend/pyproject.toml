[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "creator-studio-ai-api"
version = "0.1.0"
description = "Creator Studio AI SaaS backend"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.29,<1", "pydantic-settings>=2.5,<3", "email-validator>=2.2,<3", "pwdlib[argon2]>=0.2,<1", "python-multipart>=0.0.12,<1", "celery[redis]>=5.4,<6", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "aiosqlite>=0.20,<1", "ruff>=0.7,<1"]

[tool.ruff]
line-length = 100
target-version = "py311"
