services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: creator_studio
      POSTGRES_USER: creator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports: ["5433:5432"]
    volumes: [creator_pg:/var/lib/postgresql/data, ./backend/migrations/0001_initial.sql:/docker-entrypoint-initdb.d/001.sql:ro]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creator -d creator_studio"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    env_file: ./backend/.env
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  creator_pg:
